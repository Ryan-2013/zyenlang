[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zyenlang"
version = "0.1.83"
description = "ZyenLang: a concise C-like language transpiled to C"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ZyenLang"}]

[project.scripts]
zy = "zyenlang.transpiler:main"
zyen = "zyenlang.transpiler:main"

[tool.setuptools]
packages = ["zyenlang", "zyenlang.cli"]

[tool.setuptools.package-data]
zyenlang = [
    "std/*.zy",
    "std/*.c",
    "std/*.h",
    "vendor/raylib/LICENSE",
    "vendor/raylib/README.md",
    "vendor/raylib/VERSION",
    "vendor/raylib/windows-x64/*.dll",
    "vendor/raylib/linux-x64/*.so",
    "vendor/raylib/linux-arm64/*.so",
    "vendor/raylib/macos-universal/*.dylib",
]
