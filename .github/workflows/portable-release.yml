name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  portable:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
            python: "3.10"
          - target: linux-x64
            os: ubuntu-24.04
            python: "3.12"
          - target: linux-arm64
            os: ubuntu-24.04-arm
            python: "3.12"
          - target: macos-x64
            os: macos-15-intel
            python: "3.12"
          - target: macos-arm64
            os: macos-15
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check setuptools==80.9.0 wheel==0.45.1 pyinstaller==6.21.0 pyinstaller-hooks-contrib==2026.6
      - name: Install ZyenLang
        run: python -m pip install --disable-pip-version-check --no-build-isolation -e .
      - name: Read package version
        id: package
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          from tools.build_portable import portable_name
          source = Path("pyproject.toml").read_text(encoding="utf-8")
          version = re.search(r'^version\s*=\s*"([^"]+)"\s*$', source, re.MULTILINE).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"bundle={portable_name(version)}\n")
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
      - name: Fetch pinned and verified Zig toolchain
        run: python tools/fetch_zig.py --version 0.16.0 --output .portable/zig
      - name: Build portable archive
        run: python tools/build_portable.py --version ${{ steps.package.outputs.version }} --zig-dir .portable/zig --output-dir dist/release
      - name: Build Windows MSI
        if: runner.os == 'Windows'
        run: python tools/build_msi.py --version ${{ steps.package.outputs.version }} --stage dist/portable-work/windows-x64/${{ steps.package.outputs.bundle }} --output dist/release/${{ steps.package.outputs.bundle }}-windows-x64.msi
      - name: Run packaged Linux GUI smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          zy_bin=$(find dist/portable-work -type f -path '*/zyv*/zy' | head -n 1)
          xvfb-run -a "$zy_bin" run "$GITHUB_WORKSPACE/examples/tk_portable_smoke.zy"
      - name: Attest portable artifacts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/release/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  package:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build==1.4.0
      - run: python -m build
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  vscode:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ide/vscode/zyenlang/package-lock.json
      - name: Install locked extension tools
        working-directory: ide/vscode/zyenlang
        run: npm ci --ignore-scripts
      - name: Test extension
        working-directory: ide/vscode/zyenlang
        run: npm test
      - name: Read extension version
        id: extension
        shell: bash
        run: |
          version=$(node -p "require('./ide/vscode/zyenlang/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package extension
        working-directory: ide/vscode/zyenlang
        run: npx --no-install vsce package --no-dependencies --out ../../../dist/zyenlang-vscode-${{ steps.extension.outputs.version }}.vsix
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.vsix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vscode-extension
          path: dist/*.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable, package, vscode]
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist/release
          merge-multiple: true
      - name: Resolve release notes
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(python -c 'import re; from pathlib import Path; print(re.search(r"^version\s*=\s*\"([^\"]+)\"\s*$", Path("pyproject.toml").read_text(encoding="utf-8"), re.MULTILINE).group(1))')
          test "$version" = "$package_version"
          notes="docs/release_v${version//./_}.md"
          test -f "$notes"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Create checksums
        shell: bash
        run: |
          cd dist/release
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/release/*
          --verify-tag
          --title "ZyenLang ${{ github.ref_name }}"
          --notes-file "${{ steps.release.outputs.notes }}"
