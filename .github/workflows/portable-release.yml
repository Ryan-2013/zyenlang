name: Portable release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-latest
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip setuptools wheel pyinstaller
      - name: Install ZyenLang
        run: python -m pip install -e .
      - name: Read package version
        id: package
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          source = Path("pyproject.toml").read_text(encoding="utf-8")
          version = re.search(r'^version\s*=\s*"([^"]+)"\s*$', source, re.MULTILINE).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
      - name: Install Linux GUI runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6
      - name: Fetch verified Zig toolchain
        run: python tools/fetch_zig.py --version 0.16.0 --output .portable/zig
      - name: Build portable archive
        run: python tools/build_portable.py --version ${{ steps.package.outputs.version }} --zig-dir .portable/zig --output-dir dist/release
      - name: Run packaged Linux GUI smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          zy_bin=$(find dist/portable-work -type f -path '*/zyv*/zy' | head -n 1)
          xvfb-run -a "$zy_bin" run "$GITHUB_WORKSPACE/examples/tk_portable_smoke.zy"
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [portable, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true
      - name: Resolve release notes
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package_version=$(python -c 'import re; from pathlib import Path; print(re.search(r"^version\s*=\s*\"([^\"]+)\"\s*$", Path("pyproject.toml").read_text(encoding="utf-8"), re.MULTILINE).group(1))')
          test "$version" = "$package_version"
          notes="docs/release_v${version//./_}.md"
          test -f "$notes"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
      - name: Create checksums
        shell: bash
        run: |
          cd dist/release
          sha256sum * > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/release/*
          --verify-tag
          --title "ZyenLang ${{ github.ref_name }}"
          --notes-file "${{ steps.release.outputs.notes }}"
