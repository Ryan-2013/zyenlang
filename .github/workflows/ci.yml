name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install pinned test tools
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 setuptools==80.9.0 wheel==0.45.1
      - name: Install ZyenLang
        run: python -m pip install --disable-pip-version-check --no-build-isolation -e .
      - name: Validate repository layout
        run: python tools/check_layout.py
      - name: Python and language tests
        run: python -m pytest -q
      - name: Check public v0.3 examples
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          for source in sorted(Path("examples").glob("*.zy")):
              subprocess.run(
                  [sys.executable, "-m", "zyenlang", "check", "--file", str(source)],
                  check=True,
              )
      - name: Exercise project and explicit emit CLI
        run: |
          python -m zyenlang new .ci-smoke --name ci-smoke
          python -m zyenlang check --project .ci-smoke
          python -m zyenlang run --project .ci-smoke
          python -m zyenlang build --project .ci-smoke --release --out-dir .ci-output
          python -m zyenlang emit --file examples/v2_language_tour.zy --kind c --out-dir .ci-emit

  sanitizers:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    env:
      ZY_CC: clang
      ZY_CFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer
      ZY_LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Install ZyenLang
        run: python -m pip install --disable-pip-version-check --no-build-isolation -e .
      - name: Run ownership smoke under ASan and UBSan
        run: python -m zyenlang run --project tests/fixtures/v3_sanitizer_project app

  vscode:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ide/vscode/zyenlang/package-lock.json
      - name: Install locked extension tools
        working-directory: ide/vscode/zyenlang
        run: npm ci --ignore-scripts
      - name: Audit extension tooling
        working-directory: ide/vscode/zyenlang
        run: npm audit --audit-level=high
      - name: Test extension index and security policy
        working-directory: ide/vscode/zyenlang
        run: npm test
      - name: Validate VSIX packaging
        working-directory: ide/vscode/zyenlang
        run: npx --no-install vsce ls --no-dependencies
