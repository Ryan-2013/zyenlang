[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zyenlang"
version = "0.2.1"
description = "ZyenLang: a concise C-like language transpiled to C"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli==2.2.1; python_version < '3.11'"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ZyenLang"}]

[project.scripts]
zy = "zyenlang.cli.main:main"
zyen = "zyenlang.cli.main:main"
zyenv = "zyenlang.cli.zyenv:main"
zy2 = "zyenlang.v2.__main__:main"
zypkg = "zyenlang.v2.package_manager:main"

[tool.setuptools.packages.find]
include = ["zyenlang*"]
namespaces = true

[tool.setuptools.package-data]
zyenlang = [
    "std/*.zy",
    "std/*.c",
    "std/*.h",
    "v2/std/*.zy",
    "v2/std/*.md",
    "v2/std/*.c",
    "v2/std/*.h",
    "v2/runtime/*.h",
    "vendor/raylib/LICENSE",
    "vendor/raylib/README.md",
    "vendor/raylib/VERSION",
    "vendor/raylib/windows-x64/*.dll",
    "vendor/raylib/linux-x64/*.so",
    "vendor/raylib/linux-arm64/*.so",
    "vendor/raylib/macos-universal/*.dylib",
]
